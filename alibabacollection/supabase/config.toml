project_id = "alibaba-collection"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://127.0.0.1:5500"
additional_redirect_urls = ["http://localhost:5500"]
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = true
