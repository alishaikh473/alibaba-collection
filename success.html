<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#f3f0e8">
  <meta name="application-name" content="DiscoveryImage">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321; img-src 'self'; font-src 'self'">

<body class="payment-result-page">

    <a class="brand" href="index.html" aria-label="DiscoveryImage home"><span class="brand-mark" aria-hidden="true"><img src="favicon.svg" alt=""></span><span class="brand-name" aria-hidden="true"><span class="brand-primary">DiscoveryImage</span></span></a>
